<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="taylaxis-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#3155C8" />
    </linearGradient>
  </defs>

  <!-- Rounded Box Container -->
  <rect width="100" height="100" rx="28" fill="url(#taylaxis-grad)" />

  <!-- Rotated Scissors Icon -->
  <g transform="translate(50, 50) rotate(45) translate(-50, -50)" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Blade & Ring -->
    <circle cx="32" cy="70" r="11" />
    <path d="M40 62 L66 32" />
    
    <!-- Bottom Blade & Ring -->
    <circle cx="32" cy="30" r="11" />
    <path d="M40 38 L66 68" />
    
    <!-- Pivot Pin -->
    <circle cx="53" cy="50" r="3" fill="#FFFFFF" />
  </g>
</svg>